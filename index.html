<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>This is a basic paragraph of text on a web page.</p>

    <!-- This is a comment. It won't look like anything to the user, but it helps organize your code! -->
    
    <h2>Useful Elements</h2>
    
    <!-- An example of an external hyperlink -->
    <p>Visit the official <a href="https://www.w3schools.com" target="_blank">W3Schools website</a> for extensive documentation.</p>

    <!-- An example of adding an image -->
    <img src="https://placeholder.com" alt="Placeholder Image" width="150" height="150">

    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

</body>
</html>
